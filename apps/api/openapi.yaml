openapi: 3.0.3
info:
  title: Tournament Ranking API
  version: 1.0.0
  description: |
    REST API for tournament stats and rankings. Use it to show your teams, players,
    results and rankings on any other website.

    **Authentication:** every `/api/v1` request needs an API key in the `X-API-Key`
    header (or `Authorization: Bearer <key>`). Keys with scope `read` can only call
    `GET` endpoints, so they are safe for a public website's server. Keys with scope
    `admin` can also create, edit and delete. Create keys with `POST /api/v1/keys`
    or `npm run key:create -- "Name" read`.

    **Browser calls:** add your site's origin to `CORS_ORIGINS` on the API server.
    Prefer calling the API from your server so the key is never exposed to visitors.

    **Ratings:** each team has an Elo rating (start 1000, K = 32) recomputed from all
    matches in date order whenever a result is added, edited or deleted.

    **Games:** every player (one in-game character), team and tournament belongs to a game,
    so MMR, tiers and rankings are per game. Pass `gameId` to the ranking endpoints to get one
    game's ladder; `GET /api/v1/games` lists the games.

    **Errors** are JSON: `{ "error": "message", "details": ... }`.
servers:
  - url: http://localhost:4000
security:
  - ApiKey: []
tags:
  - name: Games
  - name: Members
  - name: Rankings
  - name: Teams
  - name: Guilds
  - name: Blacklist
  - name: Players
  - name: Tournaments
  - name: Brackets
  - name: Matches
  - name: Stats
  - name: Images
  - name: API keys
  - name: Ads
paths:
  /api/v1/games:
    get:
      tags: [Games]
      summary: List games with how many players, teams and tournaments each has
      responses:
        "200":
          description: Games by name
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/GameTitle" } } } }
    post:
      tags: [Games]
      summary: Add a game (admin)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 100 } } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/GameTitle" } } } }
        "409": { description: A game with this name exists }
  /api/v1/games/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Games]
      summary: A game with its in-game ranks
      responses:
        "200": { description: Game, content: { application/json: { schema: { $ref: "#/components/schemas/GameTitle" } } } }
    patch:
      tags: [Games]
      summary: Rename a game (its tournaments' `game` name changes too) and/or set its in-game ranks (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                ranks: { type: array, maxItems: 30, description: Lowest first, items: { $ref: "#/components/schemas/GameRank" } }
      responses:
        "200": { description: Renamed }
        "409": { description: A game with this name exists }
    delete:
      tags: [Games]
      summary: Delete a game that has no players, teams or tournaments (admin)
      responses:
        "204": { description: Deleted }
        "409": { description: The game is in use }
  /api/v1/members/{discordId}:
    parameters: [{ $ref: "#/components/parameters/discordId" }]
    get:
      tags: [Members]
      summary: A Discord member's characters with per-game rank and their teams (admin)
      description: |
        For a website or bot acting for a logged-in member. Each character has its game, tier, MMR,
        `rank` and `rankedPlayers` within that game, and its team with members. The team's
        `inviteCode` is only included when this character is the captain.
      responses:
        "200": { description: "{ data: MyCharacter[] }" }
  /api/v1/members/{discordId}/teams:
    parameters: [{ $ref: "#/components/parameters/discordId" }]
    post:
      tags: [Members]
      summary: Create a team with one of the member's characters as captain (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId, name]
              properties:
                playerId: { type: string, description: One of this member's characters, not yet in a team }
                name: { type: string, maxLength: 100 }
                tag: { type: string, maxLength: 12, nullable: true }
                logoUrl: { type: string, nullable: true }
      responses:
        "201": { description: The new team with its invite code }
        "403": { description: The character is not this member's }
        "409": { description: The character already has a team, or the name is taken }
  /api/v1/members/{discordId}/join:
    parameters: [{ $ref: "#/components/parameters/discordId" }]
    post:
      tags: [Members]
      summary: Join a team with an invite code (admin)
      description: The team must be in the character's game and have fewer than 15 players. A team with no captain makes the first joiner captain.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [playerId, code], properties: { playerId: { type: string }, code: { type: string } } } } } }
      responses:
        "200": { description: Joined }
        "400": { description: The team plays another game }
        "404": { description: No team has this code }
        "409": { description: Already in a team, or the team is full }
  /api/v1/members/{discordId}/leave:
    parameters: [{ $ref: "#/components/parameters/discordId" }]
    post:
      tags: [Members]
      summary: Leave the character's team (admin)
      description: When the captain leaves, another member becomes captain (Discord-linked members first).
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [playerId], properties: { playerId: { type: string } } } } } }
      responses:
        "200": { description: Left }
  /api/v1/members/{discordId}/kick:
    parameters: [{ $ref: "#/components/parameters/discordId" }]
    post:
      tags: [Members]
      summary: Captain removes a member from the team (admin)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [playerId, memberId], properties: { playerId: { type: string, description: The captain }, memberId: { type: string } } } } } }
      responses:
        "200": { description: Removed }
        "403": { description: Only the captain can do this }
  /api/v1/members/{discordId}/captain:
    parameters: [{ $ref: "#/components/parameters/discordId" }]
    post:
      tags: [Members]
      summary: Captain hands the captaincy to another member (admin)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [playerId, memberId], properties: { playerId: { type: string }, memberId: { type: string } } } } } }
      responses:
        "200": { description: Changed }
        "403": { description: Only the captain can do this }
  /api/v1/members/{discordId}/invite:
    parameters: [{ $ref: "#/components/parameters/discordId" }]
    post:
      tags: [Members]
      summary: Captain replaces the team's invite code; the old link stops working (admin)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [playerId], properties: { playerId: { type: string } } } } } }
      responses:
        "200": { description: "{ code }" }
        "403": { description: Only the captain can do this }
  /api/v1/members/{discordId}/solo/{tournamentId}:
    parameters:
      - { $ref: "#/components/parameters/discordId" }
      - { name: tournamentId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Members]
      summary: Sign up alone for a SOLO tournament, or change position, rank or character (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId, position, rank]
              properties:
                playerId: { type: string, description: One of this member's characters }
                position: { type: string, enum: [GUARD, FORWARD, CENTER, ALL] }
                rank: { type: string, description: "The name of one of the game's ranks (GET /games/{id})" }
      responses:
        "200": { description: The sign-up view }
        "403": { description: Not this member's character }
        "409": { description: Registration closed, teams already drawn, or not a SOLO tournament }
    delete:
      tags: [Members]
      summary: Withdraw from a SOLO tournament before the draw (admin)
      responses:
        "200": { description: The sign-up view }
  /api/v1/members/{discordId}/guild/{action}:
    parameters:
      - { $ref: "#/components/parameters/discordId" }
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [create, edit, invite, cancel-invite, accept, decline, leave, kick, leader] }
    post:
      tags: [Members]
      summary: Run this member's guild (admin)
      description: |
        Every action names the character acting (`playerId`), which must belong to this Discord account.
        - `create` { name, tag?, logoUrl?, description? }: start a guild and lead it (holds 200 members).
        - `edit` { name?, tag?, logoUrl?, description? }: leader only.
        - `invite` { uid, server? }: leader only; invites the character with this in-game UID.
        - `cancel-invite` { inviteId }: leader only.
        - `accept` / `decline` { inviteId }: the invited character's owner.
        - `leave`: a leaving leader hands over to the highest-MMR member; the last member closes the guild.
        - `kick` / `leader` { memberId }: leader only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId]
              properties:
                playerId: { type: string }
                name: { type: string, maxLength: 60 }
                tag: { type: string, maxLength: 12 }
                logoUrl: { type: string }
                description: { type: string, maxLength: 500 }
                uid: { type: string }
                server: { type: string }
                inviteId: { type: string }
                memberId: { type: string }
      responses:
        "200": { description: Done }
        "201": { description: Guild created }
        "403": { description: Not this member's character, or not the leader }
        "404": { description: Unknown action, UID, invite or member }
        "409": { description: Already in a guild, guild full, or name taken }
  /api/v1/members/invites/{code}:
    get:
      tags: [Members]
      summary: What an invite code joins - team, game, member count, full (admin)
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Invite details }
        "404": { description: No team has this code }
  /api/v1/rankings/teams:
    get:
      tags: [Rankings]
      summary: Team ranking by Elo rating
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - { name: minMatches, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: gameId, in: query, schema: { type: string }, description: "Only this game's ladder (see GET /api/v1/games)" }
      responses:
        "200":
          description: Ranked teams
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/Team"
                            - type: object
                              properties:
                                rank: { type: integer }
                                stats: { $ref: "#/components/schemas/TeamStats" }
                            - $ref: "#/components/schemas/Movement"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/rankings/mmr:
    get:
      tags: [Rankings]
      summary: Player MMR ladder with tiers, recent form and rank movement
      description: |
        Every player has a personal MMR (starts at 1000) that moves after each series they play.
        A side's strength is the average MMR of its players in that series; change = K × (result − expected),
        K = 48 for a player's first 3 series and 32 after, plus 2 per MVP and 1 per SVP.
        Players need 3 series to be ranked; until then they are listed under `placing`.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - { name: teamId, in: query, schema: { type: string } }
        - { name: gameId, in: query, schema: { type: string }, description: "Only this game's ladder (see GET /api/v1/games)" }
      responses:
        "200":
          description: Ranked players, players still placing, and the tier list with player counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/Player"
                            - $ref: "#/components/schemas/Movement"
                            - type: object
                              properties:
                                rank: { type: integer }
                                series: { type: integer, description: Series played }
                      placing:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/Player"
                            - type: object
                              properties:
                                series: { type: integer }
                                seriesToPlace: { type: integer }
                      tiers:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/Tier"
                            - type: object
                              properties: { players: { type: integer } }
                      rules: { type: object, description: The numbers used to compute MMR }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/rankings/tiers:
    get:
      tags: [Rankings]
      summary: The MMR tiers, lowest first
      responses:
        "200":
          description: Tiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Tier" } }
  /api/v1/rankings/players:
    get:
      tags: [Rankings]
      summary: Player ranking by a chosen stat
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: sort
          in: query
          schema: { type: string, enum: [mmr, pts, ppg, avgRating, reb, ast, blk, stl, lbr, mvp, wins, winRate, games], default: pts }
        - { name: minGames, in: query, description: Only players with at least this many games (minMatches is accepted as an alias), schema: { type: integer, minimum: 0, default: 0 } }
        - { name: teamId, in: query, schema: { type: string } }
        - { name: gameId, in: query, schema: { type: string }, description: "Only this game's ladder (see GET /api/v1/games)" }
      responses:
        "200":
          description: Ranked players
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      sort: { type: string }
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/Player"
                            - type: object
                              properties:
                                rank: { type: integer }
                                stats: { $ref: "#/components/schemas/PlayerStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/teams:
    get:
      tags: [Teams]
      summary: List or search teams (use for team dropdowns)
      parameters:
        - $ref: "#/components/parameters/search"
        - { name: gameId, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Team" } }
    post:
      tags: [Teams]
      summary: Create a team (admin)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TeamInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Team" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: A team with this name already exists }
  /api/v1/teams/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Teams]
      summary: Team profile with roster, stats, tournaments and recent matches
      responses:
        "200": { description: Team detail }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Teams]
      summary: Update a team (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TeamInput"
                - type: object
                  properties:
                    captainId: { type: string, nullable: true, description: A player on this team (400 otherwise) }
      responses:
        "200": { description: Updated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Teams]
      summary: Delete a team and its matches (admin)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/teams/{id}/invite:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Teams]
      summary: The team's invite code, made on first use (admin)
      description: Players open `<site>/join/<code>` to join. `?new=1` replaces the code so old links stop working.
      parameters:
        - { name: new, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200": { description: "{ code }" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/blacklist:
    get:
      tags: [Blacklist]
      summary: Players on the blacklist. A team that loses a bracket match by walkover without checking in on time is added by itself (every rostered player, 20 MMR each); organizers add others. Standing entries take their penalty off the player's MMR.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, lifted, all], default: active } }
        - { name: playerId, in: query, schema: { type: string } }
        - { name: tournamentId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 500 } }
      responses:
        "200": { description: "{ data, total }; each entry has player, tournament, teamName, matchNumber, source (AUTO | ADMIN), reason, penalty, createdAt, liftedAt, liftNote" }
    post:
      tags: [Blacklist]
      summary: Put a player on the blacklist by hand (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId, reason]
              properties:
                playerId: { type: string }
                reason: { type: string, maxLength: 300 }
                penalty: { type: integer, minimum: 0, maximum: 500, default: 20 }
      responses:
        "201": { description: The new entry }
        "404": { description: Player not found }
  /api/v1/blacklist/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Blacklist]
      summary: Lift an entry (the MMR comes back) or put it back, or change its reason or penalty (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lifted: { type: boolean }
                note: { type: string, maxLength: 300 }
                reason: { type: string, maxLength: 300 }
                penalty: { type: integer, minimum: 0, maximum: 500 }
      responses:
        "200": { description: The entry }
        "404": { description: Not found }
    delete:
      tags: [Blacklist]
      summary: Delete an entry an organizer added (admin). Walkover entries are lifted instead.
      responses:
        "204": { description: Deleted }
        "409": { description: Walkover entries can only be lifted }
  /api/v1/guilds:
    get:
      tags: [Guilds]
      summary: Guilds ranked by score (average MMR of their best 5 members who have played), each with rank, score, leader and number 1 player
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: gameId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 24, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: "{ data, total, limit, offset }" }
  /api/v1/guilds/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Guilds]
      summary: A guild with its rank and score among all guilds, and its members ranked inside the guild by MMR (guildRank; null until they have played)
      responses:
        "200": { description: "Guild with leader, top, memberCount, capacity, full and members[]" }
        "404": { description: Not found }
    patch:
      tags: [Guilds]
      summary: Edit a guild, its size (capacity) or its leader, who must be a member (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60 }
                tag: { type: string, nullable: true }
                logoUrl: { type: string, nullable: true }
                description: { type: string, nullable: true }
                capacity: { type: integer, minimum: 1, maximum: 10000 }
                leaderId: { type: string }
      responses:
        "200": { description: The guild }
        "400": { description: Leader not a member, or capacity below the member count }
    delete:
      tags: [Guilds]
      summary: Delete a guild; its members stay, without a guild (admin)
      responses:
        "204": { description: Deleted }
  /api/v1/guilds/{id}/members/{playerId}:
    delete:
      tags: [Guilds]
      summary: Remove a member; a removed leader hands over, an emptied guild closes (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: playerId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ closed, leader }" }
  /api/v1/players:
    get:
      tags: [Players]
      summary: List or search players (by name, past name or UID)
      parameters:
        - $ref: "#/components/parameters/search"
        - { name: teamId, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200": { description: Players }
    post:
      tags: [Players]
      summary: Create a player (admin)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlayerInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Player" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/players/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Players]
      summary: Player profile with MMR, tier, MMR history, past names, career stats and recent stat lines
      responses:
        "200": { description: Player detail }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Players]
      summary: Update a player, e.g. move to another team (admin)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlayerInput" } } }
      responses:
        "200": { description: Updated }
    delete:
      tags: [Players]
      summary: Delete a player (admin)
      responses:
        "204": { description: Deleted }
  /api/v1/players/uid/{uid}:
    get:
      tags: [Players]
      summary: Find a player by in-game UID (same detail as /players/{id})
      parameters:
        - { name: uid, in: path, required: true, schema: { type: string } }
        - { name: server, in: query, description: Needed only when the UID exists on several servers, schema: { type: string } }
      responses:
        "200": { description: Player detail }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/players/discord/{discordId}:
    get:
      tags: [Players]
      summary: Players a Discord account plays as (admin)
      description: Used by "Log in with Discord" on the website. Players the bot put on a roster with this account are linked on the way.
      parameters:
        - { name: discordId, in: path, required: true, schema: { type: string, pattern: "^[0-9]{5,25}$" } }
      responses:
        "200": { description: "{ data: Player[] }" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/players/discord/{discordId}/claim:
    post:
      tags: [Players]
      summary: Link the player with this UID to a Discord account, or create them (admin)
      parameters:
        - { name: discordId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uid]
              properties:
                uid: { type: string }
                server: { type: string }
                name: { type: string, description: Needed only when no player has this UID yet }
                gameId: { type: string, description: "The character's game; required when the site has more than one game" }
      responses:
        "200": { description: Existing player linked }
        "201": { description: New player created and linked }
        "400": { description: "No player has this UID and no name was sent (details.needsName: true), or the game is missing (details.needsGame: true)" }
        "409": { description: The player is linked to another Discord account }
  /api/v1/players/{id}/discord:
    delete:
      tags: [Players]
      summary: Remove a player's Discord link (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The player, now without discordId }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/players/{id}/merge:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [Players]
      summary: Merge a duplicate into this player (admin)
      description: Moves the duplicate's scoreboards, rosters and names onto this player, deletes the duplicate and replays MMR.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [fromId], properties: { fromId: { type: string } } }
      responses:
        "200": { description: The merged player detail }
        "409": { description: The two players have different UIDs or appear on the same scoreboard }
  /api/v1/tournaments:
    get:
      tags: [Tournaments]
      summary: List or search tournaments
      parameters:
        - $ref: "#/components/parameters/search"
        - { name: status, in: query, schema: { type: string, enum: [UPCOMING, ONGOING, COMPLETED] } }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200": { description: Tournaments }
    post:
      tags: [Tournaments]
      summary: Create a tournament (admin)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TournamentInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Tournament" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/tournaments/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Tournaments]
      summary: Tournament with teams, matches and standings table
      responses:
        "200": { description: Tournament detail }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tournaments]
      summary: Update a tournament (admin)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TournamentInput" } } }
      responses:
        "200": { description: Updated }
    delete:
      tags: [Tournaments]
      summary: Delete a tournament and its matches (admin)
      responses:
        "204": { description: Deleted }
  /api/v1/tournaments/{id}/entries:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [Tournaments]
      summary: Register a team or set its final placement (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId]
              properties:
                teamId: { type: string }
                placement: { type: integer, minimum: 1, nullable: true }
      responses:
        "201": { description: Entry saved }
  /api/v1/tournaments/{id}/entries/{teamId}:
    parameters:
      - $ref: "#/components/parameters/id"
      - { name: teamId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Tournaments]
      summary: Remove a team that has no matches (admin)
      responses:
        "204": { description: Removed }
        "409": { description: Team already has matches in this tournament }
  /api/v1/tournaments/{id}/registrations:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [Brackets]
      summary: Register a team with its roster (admin). Needs registrationOpen unless override.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RosterInput"
                - type: object
                  required: [teamName]
                  properties:
                    teamName: { type: string, description: An existing team with this name is reused }
                    tag: { type: string, nullable: true }
      responses:
        "201": { description: The entry with its roster }
        "409": { description: Registration closed, tournament full, team or player already registered }
  /api/v1/tournaments/{id}/entries/{teamId}/roster:
    parameters:
      - $ref: "#/components/parameters/id"
      - { name: teamId, in: path, required: true, schema: { type: string } }
    put:
      tags: [Brackets]
      summary: Replace a team's roster (admin). Locked once the first match starts, unless override.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RosterInput" } } } }
      responses:
        "200": { description: The entry with its roster }
        "409": { description: Rosters are locked }
  /api/v1/tournaments/{id}/solo:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Tournaments]
      summary: SOLO tournament sign-ups (position and in-game rank), ranks and whether teams were drawn
      responses:
        "200": { description: "{ entryMode, teamSize, ranks, registrationOpen, drawn, signups[] }" }
  /api/v1/tournaments/{id}/solo/draw:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [Tournaments]
      summary: Propose balanced teams from the sign-ups; nothing is saved (admin)
      description: Every team covers Guard, Forward and Center where it can (ALL fills any), with rank totals and MMR as even as possible. The latest sign-ups are reserves when the count doesn't divide by teamSize. Each call draws again.
      responses:
        "200": { description: "{ teams: [{ players, rankTotal, mmrAverage, positionsOk }], reserves }" }
        "409": { description: Fewer than two teams of players, or not a SOLO tournament }
  /api/v1/tournaments/{id}/solo/teams:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [Tournaments]
      summary: Save drawn teams as registered teams with rosters (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teams]
              properties:
                teams: { type: array, items: { type: array, items: { type: string, description: playerId } } }
                replace: { type: boolean, default: false, description: Replace teams drawn before (no matches played yet) }
      responses:
        "200": { description: The sign-up view with drawn true }
        "409": { description: "Teams were drawn already (details.needsReplace), or matches were played" }
  /api/v1/tournaments/{id}/solo/{playerId}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: playerId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Tournaments]
      summary: Remove one sign-up (admin)
      responses:
        "200": { description: The sign-up view }
  /api/v1/tournaments/{id}/bracket:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Brackets]
      summary: The bracket — every match slot with teams, sources (winner of M3), times, check-ins, results; round robin standings; placements
      responses:
        "200": { description: Bracket }
    delete:
      tags: [Brackets]
      summary: Remove the bracket (admin). A started bracket needs ?force=true; recorded series stay.
      parameters: [{ name: force, in: query, schema: { type: boolean } }]
      responses:
        "204": { description: Removed }
  /api/v1/tournaments/{id}/bracket/seed:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [Brackets]
      summary: Seed the teams and build a bracket to review (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, enum: [rating, random, manual], default: rating }
                order: { type: array, items: { type: string }, description: "manual: team ids, best seed first" }
                positions: { type: array, items: { type: string, nullable: true }, description: "manual, elimination: first round slots in pairs, null = bye" }
      responses:
        "200": { description: Draft bracket }
  /api/v1/tournaments/{id}/bracket/start:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [Brackets]
      summary: Confirm the draft bracket and start the tournament (admin). Registration closes.
      responses:
        "200": { description: Live bracket }
  /api/v1/tournaments/{id}/bracket/schedule:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [Brackets]
      summary: Set the start time of one match or a whole round (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduledAt]
              properties:
                match: { type: string, description: Match id, code (W1-0) or number (12 / M12) }
                stage: { type: string, enum: [W, L, GF, P3, RR] }
                round: { type: integer }
                scheduledAt: { type: string, format: date-time, nullable: true }
      responses:
        "200": { description: Match numbers updated }
  /api/v1/tournaments/{id}/bracket/matches/{match}:
    parameters:
      - $ref: "#/components/parameters/id"
      - { name: match, in: path, required: true, schema: { type: string }, description: "Match id, code (W1-0) or number (12 / M12)" }
    get:
      tags: [Brackets]
      summary: One bracket match
      responses:
        "200": { description: Bracket match }
  /api/v1/tournaments/{id}/bracket/matches/{match}/result:
    parameters:
      - $ref: "#/components/parameters/id"
      - { name: match, in: path, required: true, schema: { type: string } }
    post:
      tags: [Brackets]
      summary: Record (or with replace, correct) a played series; winners and losers move on (admin)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BracketResultInput" } } } }
      responses:
        "200": { description: Bracket match }
        "409": { description: Not ready, already has a result, or later matches would be wiped (details.affected) }
  /api/v1/tournaments/{id}/bracket/matches/{match}/walkover:
    parameters:
      - $ref: "#/components/parameters/id"
      - { name: match, in: path, required: true, schema: { type: string } }
    post:
      tags: [Brackets]
      summary: "Give the match to a team without playing (admin). mode=claim: the team checked in and the other did not arrive within lateMinutes. mode=organizer: any decision."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId, mode]
              properties:
                teamId: { type: string }
                mode: { type: string, enum: [claim, organizer] }
                force: { type: boolean }
                note: { type: string }
      responses:
        "200": { description: Bracket match }
  /api/v1/tournaments/{id}/bracket/matches/{match}/checkin:
    parameters:
      - $ref: "#/components/parameters/id"
      - { name: match, in: path, required: true, schema: { type: string } }
    post:
      tags: [Brackets]
      summary: A team checks in for its match (admin)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [teamId], properties: { teamId: { type: string } } } } } }
      responses:
        "200": { description: Bracket match }
  /api/v1/tournaments/{id}/bracket/matches/{match}/reopen:
    parameters:
      - $ref: "#/components/parameters/id"
      - { name: match, in: path, required: true, schema: { type: string } }
    post:
      tags: [Brackets]
      summary: Clear a result so the match is played again; later results that depended on it need force (admin)
      requestBody: { content: { application/json: { schema: { type: object, properties: { force: { type: boolean } } } } } }
      responses:
        "200": { description: Bracket match }
  /api/v1/tournaments/{id}/bracket/matches/{match}/dispute:
    parameters:
      - $ref: "#/components/parameters/id"
      - { name: match, in: path, required: true, schema: { type: string } }
    post:
      tags: [Brackets]
      summary: Flag a disputed result, or clear the flag with resolved=true (admin)
      requestBody: { content: { application/json: { schema: { type: object, properties: { note: { type: string }, resolved: { type: boolean } } } } } }
      responses:
        "200": { description: Bracket match }
  /api/v1/matches:
    get:
      tags: [Matches]
      summary: List series, newest first
      parameters:
        - { name: tournamentId, in: query, schema: { type: string } }
        - { name: sort, in: query, description: "played = by match date, created = by when it was recorded", schema: { type: string, enum: [played, created], default: played } }
        - { name: teamId, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200": { description: Matches }
    post:
      tags: [Matches]
      summary: Record a series with its games and player stat lines (admin)
      description: >-
        A match is a series (e.g. Bo3); scoreA/scoreB are games won and are counted from `games` when left out.
        Teams and players can be given by id or by name: unknown names are created. Both teams are registered in the
        tournament automatically. Sending a `sourceRef` that was already recorded returns 409 with the existing matchId.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MatchInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Match" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "This sourceRef was already recorded; details.matchId is the existing match" }
  /api/v1/matches/by-source:
    get:
      tags: [Matches]
      summary: Find a series by where it came from (e.g. a Discord message id)
      parameters:
        - { name: ref, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Match, content: { application/json: { schema: { $ref: "#/components/schemas/Match" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/matches/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Matches]
      summary: Series with its games, per-game stat lines and per-player totals
      responses:
        "200": { description: Match, content: { application/json: { schema: { $ref: "#/components/schemas/Match" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Matches]
      summary: Replace a match result and its stat lines (admin)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MatchInput" } } }
      responses:
        "200": { description: Updated }
    delete:
      tags: [Matches]
      summary: Delete a match (admin)
      responses:
        "204": { description: Deleted }
  /api/v1/stats/overview:
    get:
      tags: [Stats]
      summary: Totals, top teams, recent matches and upcoming tournaments
      responses:
        "200": { description: Overview }
  /api/v1/stats/admin:
    get:
      tags: [Stats]
      summary: Admin dashboard data (admin)
      description: >
        Totals, matches and new players/teams per day, the MMR tier spread, the top 5 players
        and a to-do list (players without a UID, teams without a logo, bracket matches ready to
        play, disputes, tournaments open for registration).
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 7, maximum: 90, default: 14 } }
        - { name: tz, in: query, description: Minutes ahead of UTC used to split days (Thailand is 420), schema: { type: integer, default: 420 } }
      responses:
        "200": { description: Dashboard data }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/stats/search:
    get:
      tags: [Stats]
      summary: Search teams, players and tournaments at once
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Search results }
  /api/v1/uploads:
    post:
      tags: [Images]
      summary: Upload an image (admin)
      description: PNG, JPEG, WebP or GIF up to 8 MB. Use the returned url as a team logo, player avatar or match screenshot.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, example: /uploads/1700000000000-abc123.png }
  /api/v1/extract/status:
    get:
      tags: [Images]
      summary: Whether reading results from images is configured
      responses:
        "200": { description: "{ enabled: boolean }" }
  /api/v1/extract/series:
    post:
      tags: [Images]
      summary: Read a series from scoreboard screenshots and the result post text (admin)
      description: >-
        Returns a draft (same shape as MatchInput, plus Thai `warnings` to check) for review. Nothing is saved.
        Needs ANTHROPIC_API_KEY on the server; returns 503 otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageUrls]
              properties:
                imageUrls: { type: array, minItems: 1, maxItems: 6, items: { type: string }, description: One scoreboard per game, in order }
                text: { type: string, description: 'The post text, e.g. "WD 2-0 Pai Nai"' }
                teamAId: { type: string }
                teamBId: { type: string }
      responses:
        "200": { description: "{ raw, draft }" }
        "503": { description: Image reading not configured }
  /api/v1/keys:
    get:
      tags: [API keys]
      summary: List API keys (admin)
      responses:
        "200": { description: Keys (secrets are never returned) }
    post:
      tags: [API keys]
      summary: Create an API key (admin). The key is shown only once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: My main website }
                scope: { type: string, enum: [read, admin], default: read }
      responses:
        "201": { description: Created }
  /api/v1/keys/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    delete:
      tags: [API keys]
      summary: Revoke an API key (admin)
      responses:
        "204": { description: Revoked }
  /api/v1/ads:
    get:
      tags: [Ads]
      summary: List shop ads
      parameters:
        - { name: placement, in: query, schema: { type: string, enum: [banner, card, popup] } }
        - { name: live, in: query, schema: { type: string, enum: ["1", "0"] }, description: "1 = only ads switched on and inside their start/end dates" }
      responses:
        "200":
          description: Ads, newest first
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Ad" } } } }
    post:
      tags: [Ads]
      summary: Create an ad (admin)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Ad" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/ads/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Ads]
      summary: Get an ad
      responses:
        "200": { description: The ad, content: { application/json: { schema: { $ref: "#/components/schemas/Ad" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Ads]
      summary: Replace an ad's settings (admin)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Ad" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Ads]
      summary: Delete an ad (admin)
      responses:
        "204": { description: Deleted }
  /api/v1/ads/{id}/click:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [Ads]
      summary: Count a click (admin key) and get the link to send the visitor to
      responses:
        "200": { description: Counted, content: { application/json: { schema: { type: object, properties: { linkUrl: { type: string }, clicks: { type: integer } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string } }
    search: { name: search, in: query, schema: { type: string }, description: Case-insensitive name search }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    discordId: { name: discordId, in: path, required: true, schema: { type: string, pattern: "^[0-9]{5,25}$" } }
    offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
  responses:
    BadRequest: { description: Invalid input, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: Missing or invalid API key, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Read-only key used for a write, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    GameRank:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 30 }
        iconUrl: { type: string, nullable: true, description: http(s) URL or /uploads/... path }
    GameTitle:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        ranks: { type: array, items: { $ref: "#/components/schemas/GameRank" }, description: Lowest first }
        players: { type: integer }
        teams: { type: integer }
        tournaments: { type: integer }
    Ad:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        placement: { type: string, enum: [banner, card, popup] }
        imageUrl: { type: string }
        mobileImageUrl: { type: string, nullable: true }
        linkUrl: { type: string }
        active: { type: boolean }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        clicks: { type: integer }
    AdInput:
      type: object
      required: [title, placement, imageUrl, linkUrl]
      properties:
        title: { type: string, maxLength: 100 }
        placement: { type: string, enum: [banner, card, popup], description: "banner = strip under the menu, card = home page card, popup = once-a-day popup" }
        imageUrl: { type: string, description: http(s) URL or /uploads/... path }
        mobileImageUrl: { type: string, nullable: true, description: Narrower banner image for phones }
        linkUrl: { type: string, description: http(s) URL }
        active: { type: boolean, default: true }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
    Error:
      type: object
      properties:
        error: { type: string }
        details: {}
    Page:
      type: object
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    Team:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        tag: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        country: { type: string, nullable: true }
        rating: { type: integer }
        gameId: { type: string, nullable: true }
        captainId: { type: string, nullable: true }
    TeamInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        tag: { type: string, maxLength: 12, nullable: true }
        logoUrl: { type: string, nullable: true, description: http(s) URL or /uploads/... path }
        country: { type: string, nullable: true }
        gameId: { type: string, nullable: true }
    TeamStats:
      type: object
      properties:
        matches: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        draws: { type: integer }
        winRate: { type: number, description: Percent }
        pointsFor: { type: integer }
        pointsAgainst: { type: integer }
        titles: { type: integer }
    Player:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        nickname: { type: string, nullable: true }
        country: { type: string, nullable: true }
        role: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        teamId: { type: string, nullable: true }
        uid: { type: string, nullable: true, description: In-game UID; the same player across name changes }
        server: { type: string, nullable: true }
        gameId: { type: string, nullable: true, description: The game this character plays; MMR is within it }
        mmr: { type: integer, description: Personal rating, starts at 1000 }
        peakMmr: { type: integer }
        team: { $ref: "#/components/schemas/Team" }
    PlayerInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        nickname: { type: string, nullable: true }
        country: { type: string, nullable: true }
        role: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        teamId: { type: string, nullable: true }
        uid: { type: string, nullable: true, description: One player per UID + server (409 if taken) }
        server: { type: string, nullable: true }
        gameId: { type: string, nullable: true }
    Tier:
      type: object
      properties:
        key: { type: string, example: gold }
        name: { type: string, example: Gold }
        nameTh: { type: string }
        color: { type: string, example: "#f5b400" }
        min: { type: integer }
        next: { type: integer, nullable: true, description: First MMR of the next tier }
    Movement:
      type: object
      properties:
        tier: { $ref: "#/components/schemas/Tier" }
        tierProgress: { type: integer, description: 0-100 % of the way to the next tier }
        toNextTier: { type: integer }
        form: { type: array, items: { type: string, enum: [W, L, D] }, description: Last five series, newest first }
        lastDelta: { type: integer, nullable: true, description: Rating change from the latest series }
        rankChange: { type: integer, nullable: true, description: Places gained (+) or lost (−) over the last 7 days; null = new }
    PlayerStats:
      type: object
      properties:
        matches: { type: integer, description: Series played }
        wins: { type: integer, description: Games }
        losses: { type: integer, description: Games }
        winRate: { type: number }
        games: { type: integer }
        pts: { type: integer }
        reb: { type: integer }
        blk: { type: integer }
        stl: { type: integer }
        ast: { type: integer }
        lbr: { type: integer }
        ppg: { type: number, description: Points per game }
        rpg: { type: number }
        apg: { type: number }
        avgRating: { type: number, nullable: true }
        mvp: { type: integer }
        svp: { type: integer }
    Tournament:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        game: { type: string, nullable: true, description: The game's name }
        gameId: { type: string, nullable: true }
        location: { type: string, nullable: true }
        description: { type: string, nullable: true }
        status: { type: string, enum: [UPCOMING, ONGOING, COMPLETED] }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time, nullable: true }
    TournamentInput:
      type: object
      required: [name, startDate]
      properties:
        name: { type: string }
        game: { type: string, nullable: true, description: A game name; a new name adds the game }
        gameId: { type: string, nullable: true, description: An existing game (wins over game) }
        location: { type: string, nullable: true }
        description: { type: string, nullable: true }
        status: { type: string, enum: [UPCOMING, ONGOING, COMPLETED] }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time, nullable: true }
        format: { type: string, enum: [SINGLE_ELIMINATION, DOUBLE_ELIMINATION, ROUND_ROBIN], nullable: true, description: "null = no bracket, results are recorded freely" }
        bestOf: { type: integer, enum: [1, 3, 5, 7, 9], default: 3 }
        lateMinutes: { type: integer, default: 15, description: "How late a team may check in before the other team can claim a walkover" }
        rosterMin: { type: integer, default: 3 }
        rosterMax: { type: integer, default: 5 }
        maxTeams: { type: integer, nullable: true }
        registrationOpen: { type: boolean, default: false }
        thirdPlaceMatch: { type: boolean, default: false, description: Single elimination only }
        grandFinalReset: { type: boolean, default: true, description: "Double elimination: a second final if the losers-bracket team wins the first" }
        entryMode: { type: string, enum: [TEAM, SOLO], default: TEAM, description: "SOLO = players sign up alone and are drawn into teams" }
        teamSize: { type: integer, default: 3, description: Players per drawn team (SOLO) }
    RosterInput:
      type: object
      required: [players]
      properties:
        players:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string, description: In-game name, used to match scoreboard rows }
              discordId: { type: string, nullable: true }
        captainDiscordId: { type: string, nullable: true }
        override: { type: boolean, default: false, description: "Organizer: ignore closed registration / the roster lock" }
    BracketResultInput:
      type: object
      description: Same games/scoreboards as MatchInput; teams come from the bracket match (side A/B as shown there).
      properties:
        scoreA: { type: integer }
        scoreB: { type: integer }
        games: { type: array, items: { $ref: "#/components/schemas/GameInput" } }
        notes: { type: string, nullable: true }
        source: { type: string, nullable: true }
        sourceRef: { type: string, nullable: true, description: Recording the same sourceRef twice is a no-op }
        replace: { type: boolean, default: false, description: Correct a match that already has a result }
        force: { type: boolean, default: false, description: Allow a corrected winner to wipe later results }
    PlayerStatInput:
      type: object
      description: Give playerId or name. A name is matched to the side's team, then to any player, else created.
      required: [side]
      properties:
        playerId: { type: string }
        name: { type: string }
        side: { type: string, enum: [A, B] }
        pts: { type: integer, minimum: 0 }
        reb: { type: integer, minimum: 0 }
        blk: { type: integer, minimum: 0 }
        stl: { type: integer, minimum: 0 }
        ast: { type: integer, minimum: 0 }
        lbr: { type: integer, minimum: 0 }
        rating: { type: number, nullable: true }
        award: { type: string, enum: [MVP, SVP], nullable: true }
    GameInput:
      type: object
      required: [scoreA, scoreB]
      properties:
        scoreA: { type: integer, minimum: 0 }
        scoreB: { type: integer, minimum: 0 }
        imageUrl: { type: string, nullable: true, description: Scoreboard screenshot }
        players: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/PlayerStatInput" } }
    MatchInput:
      type: object
      required: [tournamentId]
      description: Give each team by id or name, and either scoreA/scoreB or games.
      properties:
        tournamentId: { type: string }
        teamAId: { type: string }
        teamBId: { type: string }
        teamAName: { type: string }
        teamBName: { type: string }
        scoreA: { type: integer, minimum: 0, description: Games won by team A }
        scoreB: { type: integer, minimum: 0 }
        round: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true, description: Screenshot of the result }
        playedAt: { type: string, format: date-time }
        source: { type: string, nullable: true, example: discord }
        sourceRef: { type: string, nullable: true, description: Unique id of the origin (e.g. Discord message id) to prevent recording it twice }
        games: { type: array, maxItems: 9, items: { $ref: "#/components/schemas/GameInput" } }
    Match:
      type: object
      properties:
        id: { type: string }
        tournamentId: { type: string }
        round: { type: string, nullable: true }
        teamAId: { type: string }
        teamBId: { type: string }
        scoreA: { type: integer }
        scoreB: { type: integer }
        winnerId: { type: string, nullable: true, description: null means draw }
        ratingDeltaA: { type: integer }
        ratingDeltaB: { type: integer }
        imageUrl: { type: string, nullable: true }
        playedAt: { type: string, format: date-time }
        teamA: { $ref: "#/components/schemas/Team" }
        teamB: { $ref: "#/components/schemas/Team" }
