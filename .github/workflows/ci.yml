name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
      - name: End-to-end test in a browser
        run: |
          npx playwright install --with-deps chromium
          npm run setup
          npm run build -w apps/web
          DISCORD_CLIENT_ID=e2e DISCORD_CLIENT_SECRET=e2e-secret DISCORD_REQUIRED_GUILD_ID=123456789012345678 DISCORD_MEMBERSHIP_BOT_TOKEN=e2e-membership-token DISCORD_API_URL=http://localhost:4999/api DISCORD_AUTHORIZE_URL=http://localhost:4999/oauth2/authorize npm start &
          npx wait-on -t 60000 http://localhost:3000 http://localhost:4000/health
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/screenshots
          if-no-files-found: ignore

  # Same steps Bank uses on Windows: download, `npm run setup`, then start.
  windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run setup
      - run: npm test
      - run: npm run build
